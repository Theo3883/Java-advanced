# =====================================================================
# VROS test profile: fast in-memory H2, Liquibase schema, mocked JWTs.
# The JwtDecoder is built lazily from the JWK Set URI, so no Keycloak
# instance is required to boot the context.
# =====================================================================
spring.datasource.url=jdbc:h2:mem:vros_test_${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://keycloak.test.vros.org/realms/vros
vros.security.expected-audience=vros-api

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health,info
