# =====================================================================
# VROS production profile (fail-closed)
# =====================================================================

# Keycloak OIDC issuer. Every access token MUST be signed by this issuer.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/vros}

# Optional explicit JWK Set URI. If empty, it is derived from the issuer.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:}

# Audience expected in the access token `aud` claim (Keycloak audience mapper).
vros.security.expected-audience=vros-api
vros.security.client-id=vros-api

# Actuator: only health/info/metrics exposed, details only for ADMIN.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN

# Swagger / OpenAPI disabled in production unless explicitly enabled.
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:false}
springdoc.api-docs.enabled=${ENABLE_SWAGGER:false}
