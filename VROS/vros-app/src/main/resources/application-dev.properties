# =====================================================================
# VROS development profile
# =====================================================================
# WARNING: authentication is bypassed in this profile. Never deploy it.
# The bypass is implemented by a dedicated SecurityFilterChain and by
# disabling method security (see the dev chain in SecurityConfig / MethodSecurityConfig).

vros.security.dev-bypass=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/vros}
vros.security.expected-audience=vros-api
vros.security.client-id=vros-api

# Open Swagger & Actuator for local debugging.
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
