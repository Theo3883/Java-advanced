spring.application.name=VROS

# Import .env.local if present in project root
spring.config.import=optional:file:.env.local[.properties]

# Database (resolves from .env.local or defaults)
spring.datasource.url=${db.uri:${DB_URI:jdbc:postgresql://localhost:5432/vros}}
spring.datasource.username=${db.user:${DB_USER:postgres}}
spring.datasource.password=${db.pass:${DB_PASS:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Schema init (replaced by Liquibase migrations)
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

# Liquibase Database Migrations
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml


# Kafka (optimization events)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=org.vros.contracts.optimization
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.admin.fail-fast=false

vros.kafka.topics.requests=${VROS_KAFKA_REQUESTS:vros.optimization.requests}
vros.kafka.topics.acks=${VROS_KAFKA_ACKS:vros.optimization.acks}
vros.kafka.topics.results=${VROS_KAFKA_RESULTS:vros.optimization.results}
vros.kafka.topics.progress=${VROS_KAFKA_PROGRESS:vros.optimization.progress}
vros.kafka.topics.requests-dlt=${VROS_KAFKA_REQUESTS_DLT:vros.optimization.requests-dlt}
vros.kafka.topics.results-dlt=${VROS_KAFKA_RESULTS_DLT:vros.optimization.results-dlt}
vros.kafka.groups.api=vros-api
vros.kafka.groups.api-dlq=vros-api-dlq

# Caching (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s
spring.cache.cache-names=depots,drivers,customers,vehicles,deliveries

# Administration / JMX / DevTools
spring.jmx.enabled=false
spring.application.admin.enabled=false
spring.devtools.restart.enabled=false

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Resource Bundles (Messages / i18n)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Fail-closed by default: production security profile unless explicitly overridden.
spring.profiles.default=prod


