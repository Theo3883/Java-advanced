# =====================================================================
# Consumer side of the exactly-once experiment.
# =====================================================================
# Only read committed records produced by an EOS worker. Offsets are committed
# by the listener container after successful processing (ack-mode=record).
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
