spring.application.name=VROS

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/vros
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Schema init (replaced by Liquibase migrations)
spring.sql.init.mode=never
spring.sql.init.schema-locations=classpath:schema.sql

# Liquibase Database Migrations
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml


# Caching (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s
spring.cache.cache-names=depots,drivers,customers,vehicles,deliveries

# Administration / JMX / DevTools
spring.jmx.enabled=false
spring.application.admin.enabled=false
spring.devtools.restart.enabled=false

# Springdoc OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Resource Bundles (Messages / i18n)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false


