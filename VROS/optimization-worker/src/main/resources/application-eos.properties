# =====================================================================
# Exactly-once profile (request -> ack path; results are idempotent)
# =====================================================================
# The producer factory in KafkaConfig applies this prefix, the KafkaTemplate
# becomes transactional and the listener container commits offsets through the
# Kafka transaction. Result + COMPLETED ack are sent in one transaction.
spring.kafka.producer.transaction-id-prefix=vrp-worker-tx-
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.listener.ack-mode=record

vros.worker.eos=true
