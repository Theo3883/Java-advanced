spring.application.name=Lab3

# --- Library configuration ---
# Possible values: fixed | role-based
library.borrowing-policy=role-based

# Max books for fixed policy
library.fixed-limit=3

# Threshold: publish HeavyBorrowerEvent when member borrows more than this many books
library.heavy-borrower-threshold=2

# Logging
logging.level.org.example.lab3=DEBUG
